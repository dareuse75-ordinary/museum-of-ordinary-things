<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Admin Panel</title>
    <style>
        :root {
            --bg-primary: #0c0b0a;
            --bg-secondary: #121110;
            --border-color: #22201c;
            --text-main: #e6dfd5;
            --text-muted: #999085;
            --accent: #d4af37;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-primary); color: var(--text-main); font-family: "Georgia", serif; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 0.85rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
        .nav-menu { display: flex; gap: 30px; font-size: 0.8rem; letter-spacing: 2px; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .panel-title { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 10px; color: var(--accent); }
        .panel-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }

        .section-box { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 25px; margin-bottom: 30px; }
        .section-box h3 { font-size: 1rem; letter-spacing: 1px; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .artifact-row { display: flex; gap: 15px; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .artifact-thumb { width: 60px; height: 60px; object-fit: cover; border: 1px solid var(--border-color); }
        .artifact-details { flex: 1; min-width: 200px; }
        .artifact-title { font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .artifact-id { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        .audio-input-group { width: 100%; display: flex; gap: 10px; margin-top: 10px; }
        .audio-input { flex: 1; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; font-size: 0.85rem; }
        
        .btn { padding: 8px 15px; border: 1px solid var(--accent); color: var(--accent); background: transparent; cursor: pointer; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: var(--bg-primary); }
        .btn-danger { border-color: #e31b23; color: #e31b23; }
        .btn-danger:hover { background: #e31b23; color: #fff; }

        .empty-text { color: var(--text-muted); font-size: 0.85rem; font-style: italic; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Museum Admin Panel</div>
        <div class="nav-menu">
            <a href="index.html">HOME</a>
            <a href="artifacts.html">ARCHIVES</a>
            <a href="exhibitions.html">EXHIBITS</a>
            <a href="donate.html">DONATE</a>
            <a href="admin.html" class="active">ADMIN</a>
        </div>
    </header>

    <div class="container">
        <h1 class="panel-title">ADMIN CONTROL PANEL</h1>
        <p class="panel-desc">Pamahalaan ang mga donasyon, lagyan ng voice-over audio ang mga artifact, at ayusin kung saan mapupunta ang mga ito.</p>

        <!-- PENDING DONATIONS SECTION -->
        <div class="section-box">
            <h3>1. MGA NAKABINBING DONASYON (PENDING)</h3>
            <div id="pending-list"></div>
        </div>

        <!-- ACTIVE ARTIFACTS AUDIO MANAGER SECTION -->
        <div class="section-box">
            <h3>2. MGA AKTIBONG ARTIFACT (MAG-INPUT NG VOICE-OVER AUDIO)</h3>
            <div id="active-artifacts-list"></div>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            loadPending();
            loadActiveArtifacts();
        });

        function loadPending() {
            const pending = MuseumDB.getPendingArtifacts();
            const container = document.getElementById("pending-list");

            if (pending.length === 0) {
                container.innerHTML = `<div class="empty-text">Walang nakabinbing donasyon.</div>`;
                return;
            }

            container.innerHTML = pending.map(item => `
                <div class="artifact-row">
                    <img src="${item.image}" class="artifact-thumb" alt="${item.title}">
                    <div class="artifact-details">
                        <div class="artifact-title">${item.title}</div>
                        <div class="artifact-id">Mula kay: ${item.nagmamayari || 'Anonymous'}</div>
                    </div>
                    <button onclick="approve('${item.id}')" class="btn">Aprubahan</button>
                    <button onclick="reject('${item.id}')" class="btn btn-danger">Tanggihan</button>
                </div>
            `).join('');
        }

        function loadActiveArtifacts() {
            const artifacts = MuseumDB.getArtifacts();
            const container = document.getElementById("active-artifacts-list");

            if (artifacts.length === 0) {
                container.innerHTML = `<div class="empty-text">Walang nakikitang artifact.</div>`;
                return;
            }

            container.innerHTML = artifacts.map(item => `
                <div class="artifact-row">
                    <img src="${item.image}" class="artifact-thumb" alt="${item.title}">
                    <div class="artifact-details">
                        <div class="artifact-title">${item.title}</div>
                        <div class="artifact-id">${item.id} &bull; ${item.date}</div>
                        <div class="audio-input-group">
                            <input type="text" id="audio-${item.id}" class="audio-input" value="${item.audio || ''}" placeholder="I-paste ang audio link dito (hal. voice.mp3)">
                            <button onclick="saveAudio('${item.id}')" class="btn">I-save Audio</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function approve(id) {
            MuseumDB.approveArtifact(id);
            loadPending();
            loadActiveArtifacts();
            alert("Na-approve na ang artifact!");
        }

        function reject(id) {
            if (confirm("Sigurado ka bang gusto mong tanggihan ang donasyong ito?")) {
                MuseumDB.rejectArtifact(id);
                loadPending();
            }
        }

        function saveAudio(id) {
            const inputVal = document.getElementById(`audio-${id}`).value;
            const success = MuseumDB.updateArtifactAudio(id, inputVal);
            if (success) {
                alert("Matagumpay na na-save ang audio link para sa artifact na ito!");
            } else {
                alert("May naganap na error sa pag-save.");
            }
        }
    </script>
</body>
</html>
