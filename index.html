<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things</title>
    <style>
        :root {
            --bg-primary: #0c0b0a;
            --bg-secondary: #121110;
            --border-color: #22201c;
            --text-main: #e6dfd5;
            --text-muted: #999085;
            --accent: #d4af37;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-primary); color: var(--text-main); font-family: "Georgia", serif; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 0.85rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
        .nav-menu { display: flex; gap: 30px; font-size: 0.8rem; letter-spacing: 2px; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .hero { text-align: center; margin-bottom: 50px; }
        .hero h1 { font-size: 2rem; letter-spacing: 3px; margin-bottom: 15px; color: #f5f0eb; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; max-width: 600px; margin: 0 auto; }

        .featured-card { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 30px; margin-bottom: 40px; }
        .featured-img { width: 100%; height: 400px; object-fit: cover; margin-bottom: 25px; filter: grayscale(20%); }
        .meta-info { font-size: 0.75rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
        .title { font-size: 1.6rem; letter-spacing: 1px; margin-bottom: 15px; }
        .desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; }

        .btn { display: inline-block; padding: 10px 20px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: var(--bg-primary); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Museum of Ordinary Things</div>
        <div class="nav-menu">
            <a href="index.html" class="active">HOME</a>
            <a href="artifacts.html">ARCHIVES</a>
            <a href="exhibitions.html">EXHIBITS</a>
            <a href="donate.html">DONATE</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Tahanan ng mga Kwento</h1>
            <p>Isang silid-aklatan para sa mga bagay na walang pangalan, nawalan ng silbi, ngunit puno ng alaala.</p>
        </div>

        <div id="featured-container"></div>
    </div>

    <script src="db.js"></script>
    <script>
        const artifacts = MuseumDB.getArtifacts();
        const featured = artifacts[0];

        if (featured) {
            document.getElementById("featured-container").innerHTML = `
                <div class="featured-card">
                    <img src="${featured.image}" class="featured-img" alt="${featured.title}">
                    <div class="meta-info">${featured.id} &bull; ${featured.date}</div>
                    <h2 class="title">${featured.title}</h2>
                    <p class="desc">${featured.story1}</p>
                    <a href="artifacts.html" class="btn">Tingnan sa Archives</a>
                </div>
            `;
        }
    </script>
</body>
</html>
