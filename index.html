<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e6dfd5;
            font-family: serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .exhibit-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .image-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .nav-links {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .nav-links button {
            background: none;
            border: none;
            color: #e6dfd5;
            font-family: serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 0;
        }
        .nav-links button:hover:not(:disabled) {
            color: #d4af37;
        }
        .nav-links button:disabled {
            color: #444;
            cursor: default;
        }
        .description {
            width: 100%;
            max-width: 600px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .artifact-title {
            color: #d4af37;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .artifact-desc {
            font-size: 1.8rem;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="exhibit-header">
        <span>MUSEUM OF ORDINARY THINGS</span>
        <span id="exhibit-num" style="color: #d4af37;"></span>
    </div>

    <div class="image-container">
        <img id="exhibit-img" src="" alt="Exhibit Image">
    </div>

    <div class="nav-links">
        <button id="prev-btn" onclick="changeExhibit(-1)">&langk; PREV</button>
        <span id="counter"></span>
        <button id="next-btn" onclick="changeExhibit(1)">NEXT &rang;</button>
    </div>

    <div class="description">
        <div id="artifact-id" class="artifact-title"></div>
        <div id="artifact-desc" class="artifact-desc"></div>
    </div>

    <script>
        // Dito mo lang idadagdag ang mga susunod na item sa madaling paraan!
        const exhibits = [
            {
                img: "exhibit01.jpg",
                desc: "Ang Paypay ng Baler na May Maluwag na..."
            },
            {
                img: "exhibit02.jpg",
                desc: "Pangalawang Artifact sa Museo"
            }
            // Pag magdaragdag ka ng exhibit03, ganito lang kasimple ang idagdag sa ibaba:
            // {
            //     img: "exhibit03.jpg",
            //     desc: "Ikatlong kwento ng artifact..."
            // }
        ];

        let currentIndex = 0;

        function updateExhibit() {
            const current = exhibits[currentIndex];
            const numStr = String(currentIndex + 1).padStart(2, '0');
            const totalStr = String(exhibits.length).padStart(2, '0');

            document.getElementById("exhibit-num").innerText = "EXHIBIT" + numStr;
            document.getElementById("exhibit-img").src = current.img;
            document.getElementById("artifact-id").innerText = "ARTIFACT #" + numStr;
            document.getElementById("artifact-desc").innerText = current.desc;
            document.getElementById("counter",).innerText = numStr + " / " + totalStr;

            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").disabled = currentIndex === exhibits.length - 1;
        }

        function changeExhibit(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= exhibits.length) currentIndex = exhibits.length - 1;
            updateExhibit();
        }

        updateExhibit();
    </script>

</body>
</html>
