<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things</title>
    <style>
        :root {
            --bg-primary: #0c0b0a;
            --bg-secondary: #121110;
            --border-color: #22201c;
            --text-main: #e6dfd5;
            --text-muted: #999085;
            --accent: #d4af37;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-primary); color: var(--text-main); font-family: "Georgia", serif; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 0.85rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
        .nav-menu { display: flex; gap: 30px; font-size: 0.8rem; letter-spacing: 2px; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .hero { text-align: center; margin-bottom: 50px; }
        .hero h1 { font-size: 2rem; letter-spacing: 3px; margin-bottom: 15px; color: #f5f0eb; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; max-width: 600px; margin: 0 auto; }

        .featured-card { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 30px; margin-bottom: 40px; }
        .featured-img { width: 100%; height: 400px; object-fit: cover; margin-bottom: 25px; filter: grayscale(20%); }
        .meta-info { font-size: 0.75rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
        .title { font-size: 1.6rem; letter-spacing: 1px; margin-bottom: 15px; }
        .desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; }

        .action-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 10px 15px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; background: transparent; cursor: pointer; }
        .btn:hover { background: var(--accent); color: var(--bg-primary); }
        
        /* Social Media & Audio Button Colors */
        .btn-fb { border-color: #1877f2; color: #1877f2; }
        .btn-fb:hover { background: #1877f2; color: #ffffff; }

        .btn-tiktok { border-color: #ff0050; color: #ff0050; }
        .btn-tiktok:hover { background: #ff0050; color: #ffffff; }

        .btn-ig { border-color: #e1306c; color: #e1306c; }
        .btn-ig:hover { background: #e1306c; color: #ffffff; }

        .btn-audio { border-color: #4CAF50; color: #4CAF50; }
        .btn-audio:hover { background: #4CAF50; color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Museum of Ordinary Things</div>
        <div class="nav-menu">
            <a href="index.html" class="active">HOME</a>
            <a href="artifacts.html">ARCHIVES</a>
            <a href="exhibitions.html">EXHIBITS</a>
            <a href="donate.html">DONATE</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Tahanan ng mga Kwento</h1>
            <p>Isang silid-aklatan para sa mga bagay na walang pangalan, nawalan ng silbi, ngunit puno ng alaala.</p>
        </div>

        <div id="featured-container"></div>
    </div>

    <script src="db.js"></script>
    <script>
        const artifacts = MuseumDB.getArtifacts();
        const featured = artifacts[0];

        if (featured) {
            document.getElementById("featured-container").innerHTML = `
                <div class="featured-card">
                    <img src="${featured.image}" class="featured-img" alt="${featured.title}">
                    <div class="meta-info">${featured.id} &bull; ${featured.date}</div>
                    <h2 class="title">${featured.title}</h2>
                    <p class="desc">${featured.story1}</p>
                    <div class="action-buttons">
                        <a href="artifacts.html" class="btn">Archives</a>
                        <button onclick="shareArtifact('${featured.title}', window.location.href)" class="btn">🔗 Iba pa</button>
                        <button onclick="shareToFacebook(window.location.href)" class="btn btn-fb">f Facebook</button>
                        <button onclick="shareToSocial('TikTok', window.location.href)" class="btn btn-tiktok">♪ TikTok</button>
                        <button onclick="shareToSocial('Instagram', window.location.href)" class="btn btn-ig">📸 Instagram</button>
                        <button onclick="speakText('${encodeURIComponent(featured.title + '. ' + featured.story1)}', this)" class="btn btn-audio">🔊 Pakinggan</button>
                    </div>
                </div>
            `;
        }

        function shareArtifact(title, url) {
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `Tingnan ang kwento ng artifact na ito: ${title}`,
                    url: url,
                }).catch((error) => console.log('Error:', error));
            } else {
                copyToClipboard(url);
            }
        }

        function shareToFacebook(url) {
            const fbShareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
            window.open(fbShareUrl, '_blank', 'width=600,height=400');
        }

        function shareToSocial(platform, url) {
            navigator.clipboard.writeText(url).then(() => {
                alert(`Nakopya na ang link para sa ${platform}! Pwede mo na itong i-paste sa iyong ${platform} post o story.`);
            }).catch(err => {
                console.error('Copy error: ', err);
            });
        }

        function speakText(encodedText, buttonElement) {
            if ('speechSynthesis' in window) {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    buttonElement.innerText = "🔊 Pakinggan";
                    return;
                }

                const text = decodeURIComponent(encodedText);
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fil-PH';
                utterance.rate = 0.9;

                buttonElement.innerText = "⏹ Itigil";

                utterance.onend = function() {
                    buttonElement.innerText = "🔊 Pakinggan";
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Pasensya na, hindi sinusuportahan ng iyong browser ang Voice Over feature.");
            }
        }
    </script>
</body>
</html>
