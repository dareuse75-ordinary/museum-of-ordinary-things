<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things - Archives</title>
    <style>
        :root {
            --bg-primary: #0c0b0a;
            --bg-secondary: #121110;
            --border-color: #22201c;
            --text-main: #e6dfd5;
            --text-muted: #999085;
            --accent: #d4af37;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-primary); color: var(--text-main); font-family: "Georgia", serif; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 0.85rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
        .nav-menu { display: flex; gap: 30px; font-size: 0.8rem; letter-spacing: 2px; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .viewer { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 40px; margin-bottom: 30px; }
        .viewer img { width: 100%; height: 450px; object-fit: cover; margin-bottom: 25px; filter: grayscale(15%); }
        .meta { font-size: 0.75rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
        .artifact-title { font-size: 2rem; margin-bottom: 20px; color: #f5f0eb; }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .details-grid div span { color: var(--text-muted); display: block; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }

        .stories p { color: var(--text-muted); line-height: 1.8; margin-bottom: 15px; font-size: 0.95rem; }

        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .stats { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 20px; }
        .like-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 0.75rem; letter-spacing: 2px; transition: 0.3s; }
        .like-btn:hover { background: var(--accent); color: var(--bg-primary); }

        .nav-controls { display: flex; justify-content: center; gap: 30px; align-items: center; margin-top: 20px; font-size: 0.85rem; letter-spacing: 2px; }
        .nav-controls button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 0.85rem; letter-spacing: 2px; transition: 0.3s; }
        .nav-controls button:hover { color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Museum of Ordinary Things</div>
        <div class="nav-menu">
            <a href="index.html">HOME</a>
            <a href="artifacts.html" class="active">ARCHIVES</a>
            <a href="exhibitions.html">EXHIBITS</a>
            <a href="donate.html">DONATE</a>
        </div>
    </header>

    <div class="container">
        <div id="viewer-container"></div>
        <div class="nav-controls" id="nav-controls"></div>
    </div>

    <script src="db.js"></script>
    <script>
        let currentIndex = 0;
        const artifacts = MuseumDB.getArtifacts();

        function renderArtifact(index) {
            const item = artifacts[index];
            MuseumDB.incrementView(item.id);

            document.getElementById("viewer-container").innerHTML = `
                <div class="viewer">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="meta">${item.id} &bull; ${item.date}</div>
                    <h1 class="artifact-title">${item.title}</h1>
                    
                    <div class="details-grid">
                        <div><span>Pinanggalingan</span> ${item.origin}</div>
                        <div><span>Materyales</span> ${item.materials}</div>
                        <div><span>Nagmamay-ari</span> ${item.owner}</div>
                        <div><span>Tala</span> ${item.notes}</div>
                    </div>

                    <div class="stories">
                        <p>${item.story1}</p>
                        ${item.story2 ? `<p>${item.story2}</p>` : ''}
                    </div>

                    <div class="actions">
                        <div class="stats">
                            <span>Views: ${item.views}</span>
                            <span>Likes: ${item.likes}</span>
                        </div>
                        <button class="like-btn" onclick="handleLike('${item.id}')">${item.liked ? 'NA-LIKE NA' : 'I-LIKE'}</button>
                    </div>
                </div>
            `;

            document.getElementById("nav-controls").innerHTML = `
                <button onclick="prevItem()" ${index === 0 ? 'style="opacity:0.3; cursor:not-allowed;"' : ''}>&lang; PREV</button>
                <span>${String(index + 1).padStart(2, '0')} / ${String(artifacts.length).padStart(2, '0')}</span>
                <button onclick="nextItem()" ${index === artifacts.length - 1 ? 'style="opacity:0.3; cursor:not-allowed;"' : ''}>NEXT &rang;</button>
            `;
        }

        function nextItem() {
            if (currentIndex < artifacts.length - 1) {
                currentIndex++;
                renderArtifact(currentIndex);
            }
        }

        function prevItem() {
            if (currentIndex > 0) {
                currentIndex--;
                renderArtifact(currentIndex);
            }
        }

        function handleLike(id) {
            MuseumDB.toggleLike(id);
            artifacts.length = 0;
            artifacts.push(...MuseumDB.getArtifacts());
            renderArtifact(currentIndex);
        }

        renderArtifact(currentIndex);
    </script>
</body>
</html>
