<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things</title>
    <style>
        body {
            background-color: #0c0b0a;
            color: #d6cfc7;
            font-family: serif;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            border-bottom: 1px solid #1a1917;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }
        .logo {
            font-weight: normal;
            letter-spacing: 3px;
            cursor: pointer;
        }
        .nav-menu {
            display: flex;
            gap: 30px;
        }
        .nav-menu span, .nav-menu a {
            color: #a8a095;
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
            font-family: serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            padding: 0;
        }
        .nav-menu span:hover, .nav-menu a:hover, .logo:hover {
            color: #d6cfc7;
        }
        
        /* Museum Split Layout (Home View) */
        .museum-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: calc(100vh - 80px);
        }

        /* Left Side: Image & Navigation */
        .left-panel {
            background-color: #121110;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            border-right: 1px solid #1a1917;
        }
        .image-wrapper {
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .image-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 550px;
            margin-top: 30px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #8c857b;
        }
        .image-nav button {
            background: none;
            border: none;
            color: #d6cfc7;
            font-family: serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 0;
        }
        .image-nav button:hover:not(:disabled) {
            color: #d4af37;
        }
        .image-nav button:disabled {
            color: #383531;
            cursor: default;
        }

        /* Right Side: Details & Story */
        .right-panel {
            padding: 60px 50px;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }
        .artifact-id {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #a8a095;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .artifact-title {
            font-size: 2.5rem;
            font-weight: normal;
            line-height: 1.2;
            color: #e8e2d8;
            margin-bottom: 35px;
            font-family: serif;
        }
        
        .metadata-grid {
            display: grid;
            grid-template-columns: 130px 1fr;
            row-gap: 12px;
            font-size: 0.9rem;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #1f1d1a;
        }
        .meta-label {
            color: #8c857b;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .meta-value {
            color: #d6cfc7;
        }

        .section-heading {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #a8a095;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .story-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #1f1d1a;
        }
        .story-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #c5bdb2;
            margin-bottom: 15px;
        }
        .museum-notes-section {
            font-size: 1rem;
            line-height: 1.6;
            color: #a8a095;
            font-style: italic;
        }

        /* Artifacts Thumbnail Archive View */
        .archive-container {
            padding: 50px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .archive-title {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #e8e2d8;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .archive-subtitle {
            font-size: 0.9rem;
            color: #8c857b;
            margin-bottom: 40px;
        }
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .thumb-card {
            background-color: #121110;
            border: 1px solid #1a1917;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .thumb-card:hover {
            border-color: #d4af37;
        }
        .thumb-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .thumb-body {
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive para sa Mobile */
        @media (max-width: 900px) {
            .museum-container {
                grid-template-columns: 1fr;
            }
            header {
                padding: 20px;
            }
            .nav-menu {
                display: none;
            }
            .right-panel {
                padding: 30px 20px;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchView('home')">MUSEUM OF ORDINARY THINGS</div>
        <div class="nav-menu">
            <span onclick="switchView('home')">EXHIBITIONS</span>
            <span onclick="switchView('artifacts')">ARTIFACTS</span>
            <span>ABOUT</span>
            <span>DONATE AN ARTIFACT</span>
        </div>
    </header>

    <!-- HOME VIEW: Manghihiram ng Top 3 Recents mula sa Artifacts database -->
    <div id="home-view" class="museum-container">
        <div class="left-panel">
            <div class="image-wrapper">
                <img id="exhibit-img" src="" alt="Artifact Image">
            </div>
            <div class="image-nav">
                <button id="prev-btn" onclick="changeHomeExhibit(-1)">&lang; PREV</button>
                <span id="counter">01 / 03</span>
                <button id="next-btn" onclick="changeHomeExhibit(1)">NEXT &rang;</button>
            </div>
        </div>

        <div class="right-panel">
            <div id="art-id" class="artifact-id"></div>
            <h1 id="art-title" class="artifact-title"></h1>

            <div class="metadata-grid">
                <div class="meta-label">Date</div>
                <div id="meta-date" class="meta-value"></div>

                <div class="meta-label">Origin</div>
                <div id="meta-origin" class="meta-value"></div>

                <div class="meta-label">Materials</div>
                <div id="meta-materials" class="meta-value"></div>

                <div class="meta-label">Dimensions</div>
                <div id="meta-dimensions" class="meta-value"></div>

                <div class="meta-label">Owner</div>
                <div id="meta-owner" class="meta-value"></div>
            </div>

            <div class="story-section">
                <div class="section-heading">The Story</div>
                <div id="art-story-1" class="story-text"></div>
                <div id="art-story-2" class="story-text"></div>
            </div>

            <div class="museum-notes-section">
                <div class="section-heading">Museum Notes</div>
                <div id="art-notes"></div>
            </div>
        </div>
    </div>

    <!-- ARTIFACTS VIEW: Dito makikita ang lahat ng thumbnails at titles -->
    <div id="artifacts-view" class="archive-container hidden">
        <div class="archive-title">Artifacts Archive</div>
        <div class="archive-subtitle">Ang kumpletong koleksyon ng mga ordinaryong bagay.</div>
        <div id="artifacts-grid" class="archive-grid"></div>
    </div>

    <script>
        // 1. ANG MASTER DATABASE NG MGA ARTIFACTS
        // Kapag nagdagdag ka ng Exhibit 04 sa hinaharap, ilagay lang sa unahan ng listahang ito.
        const allArtifacts = [
            {
                id: "ARTIFACT #03",
                title: "Ang Tasang Tagapagtanggol sa Antok",
                date: "Circa 2021",
                origin: "Gilid ng Laptop na Puno ng Alikabok",
                materials: "Ceramic na may bahid ng kape",
                dimensions: "Approx. 10 x 8 cm",
                owner: "Taong Laging Overdue sa Deadlines",
                story1: "Ipinagmamalaki nitong tasa ang kanyang natatanging kakayahan na magtimpla ng kape na mas matapang pa sa desisyon mong magpuyat.",
                story2: "Madalas itong magsilbing ebidensya ng iyong caffeine addiction.",
                notes: "Babala: Huwag aamuyin ang ilalim kapag nakalimutang hugasan."
            },
            {
                id: "ARTIFACT #02",
                title: "Ang Kamot-Likod",
                date: "Circa 2018",
                origin: "Tapat ng Salamin sa Kwarto",
                materials: "Kahoy at Metal",
                dimensions: "Approx. 45 x 3 cm",
                owner: "Anonymous Curator",
                story1: "Ang mahiwagang kasangkapang ito ay tumutugon sa mga makakati at mahirap abutin na bahagi ng katawan.",
                story2: "Sa mga sandaling mag-isa ka, ito ang nagbibigay ng agarang ginhawa.",
                notes: "Isang simpleng sandata para sa malalim na pangangati."
            },
            {
                id: "ARTIFACT #01",
                title: "Ang Paypay ng Tag-init",
                date: "Circa 2015",
                origin: "Baler, Aurora",
                materials: "Bamboo, Fabric, Paper",
                dimensions: "Approx. 35 x 20 cm",
                owner: "Lokal na Manlalakbay",
                story1: "Nadaanan na ng simpleng paypay na ito ang mga panahong walang kuryente at mainit na hapon.",
                story2: "Hindi ito ang pinakamahalagang kagamitan pero ito ang laging sumasalo sa init.",
                notes: "Isang ordinaryong sandata laban sa init."
            }
        ];

        // 2. MANGHIHIRAM ANG HOMEPAGE NG UP TO 3 RECENTS MULA SA MASTER DATABASE
        let homeExhibits = allArtifacts.slice(0, 3);
        let currentIndex = 0;

        function updateHomeDisplay() {
            if (homeExhibits.length === 0) return;
            const current = homeExhibits[currentIndex];
            
            // Hanapin ang tamang index sa master database para sa imahe
            const originalIndex = allArtifacts.indexOf(current);
            const imgFilename = "Exhibit 0" + (originalIndex + 1) + ".jpg";

            document.getElementById("exhibit-img").src = imgFilename;
            document.getElementById("art-id").innerText = current.id;
            document.getElementById("art-title").innerText = current.title;
            document.getElementById("meta-date").innerText = current.date;
            document.getElementById("meta-origin").innerText = current.origin;
            document.getElementById("meta-materials").innerText = current.materials;
            document.getElementById("meta-dimensions").innerText = current.dimensions;
            document.getElementById("meta-owner").innerText = current.owner;
            document.getElementById("art-story-1").innerText = current.story1;
            document.getElementById("art-story-2").innerText = current.story2;
            document.getElementById("art-notes").innerText = current.notes;
            
            const numStr = String(currentIndex + 1).padStart(2, '0');
            const totalStr = String(homeExhibits.length).padStart(2, '0');
            document.getElementById("counter").innerText = numStr + " / " + totalStr;

            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").disabled = currentIndex === homeExhibits.length - 1;
        }

        function changeHomeExhibit(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= homeExhibits.length) currentIndex = homeExhibits.length - 1;
            updateHomeDisplay();
        }

        // 3. I-RENDER ANG THUMBNAILS SA ARTIFACTS OPTION
        function renderArtifactsArchive() {
            const grid = document.getElementById("artifacts-grid");
            grid.innerHTML = "";

            allArtifacts.forEach((item, index) => {
                const imgNum = allArtifacts.length - index;
                const card = document.createElement("div");
                card.className = "thumb-card";
                card.innerHTML = `
                    <img src="Exhibit 0${imgNum}.jpg" alt="${item.title}" class="thumb-img" onerror="this.src='https://via.placeholder.com/280x180?text=Exhibit'">
                    <div class="thumb-body">
                        <div class="artifact-id">${item.id}</div>
                        <div style="font-size: 1.1rem; color: #e8e2d8; margin-top: 5px;">${item.title}</div>
                    </div>
                `;
                // Kapag pinindot ang isang artifact sa archive, ibalik siya sa homepage at ipakita ito!
                card.onclick = function() {
                    // Hanapin kung nasaan ito sa homeExhibits, kung hindi man ay ilagay sa unahan o direktang i-display
                    const targetIndex = homeExhibits.indexOf(item);
                    if (targetIndex !== -1) {
                        currentIndex = targetIndex;
                    } else {
                        currentIndex = 0;
                    }
                    switchView('home');
                    updateHomeDisplay();
                };
                grid.appendChild(card);
            });
        }

        // 4. FUNCTION PARA SA PAGLIPAT NG VIEWS
        function switchView(viewName) {
            const homeView = document.getElementById("home-view");
            const artifactsView = document.getElementById("artifacts-view");

            if (viewName === 'home') {
                homeView.classList.remove('hidden');
                artifactsView.classList.add('hidden');
            } else if (viewName === 'artifacts') {
                artifactsView.classList.remove('hidden');
                homeView.classList.add('hidden');
            }
        }

        // Patakbuhin sa simula
        updateHomeDisplay();
        renderArtifactsArchive();
    </script>

</body>
</html>
