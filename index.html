<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #1a1917;
            color: #f4f1ea;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 40px 20px 20px;
            border-bottom: 1px solid #333;
            background: #141312;
        }
        .museum-subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 10px;
        }
        h1.museum-title {
            font-size: 26px;
            letter-spacing: 3px;
            margin: 0 0 20px 0;
            font-weight: normal;
            color: #fff;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            text-decoration: none;
            color: #ccc;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #fff;
            border-bottom: 1px solid #fff;
        }

        .centerpiece-container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
            text-align: center;
        }
        .section-tag {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b59f78;
            margin-bottom: 20px;
        }
        
        .exhibit-card {
            background: #242220;
            border: 1px solid #3d3a36;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
        }
        .image-frame {
            background: #000;
            padding: 15px;
            border: 1px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
            cursor: pointer;
        }
        .exhibit-card img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }
        .exhibit-meta {
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }
        .exhibit-title {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            cursor: pointer;
        }
        .exhibit-title:hover {
            color: #b59f78;
        }
        .exhibit-desc {
            font-size: 15px;
            line-height: 1.8;
            color: #d1cbd0;
            font-style: italic;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .exhibit-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #3d3a36;
            padding-top: 20px;
            font-size: 13px;
            color: #ccc;
            flex-wrap: wrap;
            gap: 15px;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .interactive-btn {
            background: transparent;
            border: 1px solid #555;
            color: #f4f1ea;
            padding: 6px 14px;
            cursor: pointer;
            font-family: 'Times New Roman', serif;
            font-size: 13px;
            transition: all 0.2s;
        }
        .interactive-btn:hover {
            background: #f4f1ea;
            color: #1a1917;
            border-color: #f4f1ea;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 11px;
            color: #777;
            border-top: 1px solid #333;
            background: #141312;
            letter-spacing: 1px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="museum-subtitle">Est. 2026 • Digital Sanctuary of Forgotten Memories</div>
        <h1 class="museum-title">MUSEUM OF ORDINARY THINGS</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="artifacts.html">Archives</a>
            <a href="exhibition.html">Exhibition</a>
            <a href="donate.html">Donate</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main class="centerpiece-container">
        <div class="section-tag">— Pinakatampok na Obra (Featured Centerpiece) —</div>
        
        <div id="centerpiece-display">
            <!-- Dito kusang lilitaw ang buong detalye ng centerpiece -->
        </div>
    </main>

    <footer>
        &copy; 2026 Museum of Ordinary Things. All rights reserved.
    </footer>

    <script src="db.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const displayContainer = document.getElementById("centerpiece-display");
            if (!displayContainer) return;

            const artifacts = getArtifacts();
            const approved = artifacts.filter(item => item.status === "Approved" || !item.status);

            if (approved.length === 0) {
                displayContainer.innerHTML = `<p style="color: #888; padding: 40px;">Wala pang naka-display na obra sa kasalukuyan.</p>`;
                return;
            }

            // Kunin ang pinakahuling inambag para gawing centerpiece
            const latestItem = approved[approved.length - 1];

            displayContainer.innerHTML = `
                <div class="exhibit-card">
                    <div class="image-frame" onclick="window.location.href='artifacts.html?id=${latestItem.id}'">
                        <img src="${latestItem.imageUrl}" alt="${latestItem.title}">
                    </div>
                    <div class="exhibit-meta">${latestItem.imageName || ''} | ${latestItem.descriptionName || ''}</div>
                    <div class="exhibit-title" onclick="window.location.href='artifacts.html?id=${latestItem.id}'">${latestItem.title}</div>
                    <div class="exhibit-desc">"${latestItem.description}"</div>
                    
                    <div class="exhibit-footer">
                        <div>
                            <span>👁️ ${latestItem.views || 0} Views</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
                            <span>❤️ ${latestItem.likes || 0} Likes</span>
                        </div>
                        <div class="action-btns">
                            ${latestItem.audioUrl ? `
                                <audio controls style="height: 32px; max-width: 190px;">
                                    <source src="${latestItem.audioUrl}" type="audio/mpeg">
                                    Ang browser mo ay hindi sumusuporta sa audio.
                                </audio>
                            ` : `<span>🎧 ${latestItem.audioName || 'Walang Audio'}</span>`}
                            
                            <button class="interactive-btn" onclick="shareCenterpiece('${latestItem.title}')">Ibahagi</button>
                            <button class="interactive-btn" onclick="window.location.href='artifacts.html?id=${latestItem.id}'">Tingnan sa Archives</button>
                        </div>
                    </div>
                </div>
            `;
        });

        function shareCenterpiece(title) {
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `Tingnan ang kwento ng "${title}" sa Museum of Ordinary Things!`,
                    url: window.location.href,
                }).catch((error) => console.log('Error sharing:', error));
            } else {
                alert("Naka-kopya o handa nang ibahagi ang obrang ito!");
            }
        }
    </script>
</body>
</html>
