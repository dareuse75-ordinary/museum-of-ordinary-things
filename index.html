<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Ordinary Things</title>
    <style>
        body {
            background-color: #0b0a09;
            color: #e6dfd5;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
        }
        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #22201c;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .top-nav a {
            color: #999085;
            text-decoration: none;
            margin-left: 20px;
        }
        .top-nav a:hover, .top-nav a.active {
            color: #d4af37;
        }
        .museum-logo {
            color: #d4af37;
            font-weight: bold;
        }
        .main-content {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .intro-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .intro-section h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 10px;
        }
        .intro-section p {
            color: #999085;
            font-size: 0.9rem;
        }
        .artifact-card {
            background: #121110;
            border: 1px solid #22201c;
            padding: 25px;
            margin-bottom: 30px;
        }
        .artifact-card img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border: 1px solid #22201c;
            margin-bottom: 15px;
            display: block;
        }
        .artifact-meta {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .artifact-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 15px;
        }
        .artifact-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            color: #999085;
            border-top: 1px solid #22201c;
            border-bottom: 1px solid #22201c;
            padding: 10px 0;
        }
        .artifact-details div span {
            color: #e6dfd5;
        }
        .artifact-story {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e6dfd5;
        }
        .btn-pakinggan {
            padding: 8px 15px;
            border: 1px solid #d4af37;
            color: #d4af37;
            background: transparent;
            cursor: pointer;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
        }
        .btn-pakinggan:hover {
            background: #d4af37;
            color: #0b0a09;
        }
    </style>
</head>
<body>

    <!-- Header Navigation (Home, Archives, Exhibits, Donate) -->
    <div class="top-nav">
        <div class="museum-logo">Museum of Ordinary Things</div>
        <div>
            <a href="index.html" class="active">Home</a>
            <a href="archives.html">Archives</a>
            <a href="exhibit.html">Exhibit</a>
            <a href="donate.html">Donate</a>
        </div>
    </div>

    <div class="main-content">
        <!-- Tahanan ng mga Kwento Header -->
        <div class="intro-section">
            <h1>Tahanan ng mga Kwento</h1>
            <p>Isang siliit aklaran para sa mga bagay na walang pangalan, nawalan ng silid, ngunit puno ng alaala.</p>
        </div>

        <!-- Dito lalabas ang mga artifact mula sa database -->
        <div id="artifact-container"></div>
    </div>

    <!-- Database Script -->
    <script src="db.js"></script>

    <!-- Script para sa pag-load ng artifact, litrato, at audio -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            loadMuseumHome();
        });

        function playAudio(audioUrl) {
            if (!audioUrl || audioUrl.trim() === "") {
                alert("Wala pang voice-over audio ang artifact na ito. Magdagdag sa Admin Panel.");
                return;
            }
            const audio = new Audio(audioUrl);
            audio.play().catch(error => {
                console.error("Error sa pag-play ng audio:", error);
                alert("Hindi ma-play ang audio. Siguraduhing tama at naka-set sa 'Anyone with the link' ang iyong Google Drive link.");
            });
        }

        function loadMuseumHome() {
            const artifacts = MuseumDB.getArtifacts();
            const container = document.getElementById("artifact-container");

            if (!container) return;

            if (artifacts.length === 0) {
                container.innerHTML = '<p style="color: #999085; text-align: center;">Walang makitang artifact.</p>';
                return;
            }

            let htmlContent = "";
            
            for (let i = 0; i < artifacts.length; i++) {
                let item = artifacts[i];
                
                let pinanggalingan = item.pinanggalingan ? item.pinanggalingan : 'Walang nakalagay';
                let materyales = item.materyales ? item.materyales : 'Walang nakalagay';
                let nagmamayari = item.nagmamayari ? item.nagmamayari : 'Walang nakalagay';
                let tala = item.tala ? item.tala : 'Walang nakalagay';
                
                // Sinisiguro natin na babagsak sa abaniko.jpg kung sakaling walang laman ang image field
                let imageSrc = (item.image && item.image.trim() !== "") ? item.image : 'abaniko.jpg';

                htmlContent += '<div class="artifact-card">';
                // Siguraduhing naka-upload ang abaniko.jpg sa GitHub repository mo para lumitaw ito nang tama
                htmlContent += '<img src="' + imageSrc + '" alt="' + item.title + '" onerror="this.onerror=null; this.src=\'abaniko.jpg\';">';
                
                htmlContent += '<div class="artifact-meta">' + (item.id || 'Artifact #01') + ' &bull; ' + (item.date || 'Circa 2025') + '</div>';
                htmlContent += '<h2 class="artifact-title">' + item.title + '</h2>';
                
                htmlContent += '<div class="artifact-details">';
                htmlContent += '<div><b>PINANGGAGALINGAN:</b><br><span>' + pinanggalingan + '</span></div>';
                htmlContent += '<div><b>MATERYALES:</b><br><span>' + materyales + '</span></div>';
                htmlContent += '<div><b>NAGMAMAY-ARI:</b><br><span>' + nagmamayari + '</span></div>';
                htmlContent += '<div><b>TALA:</b><br><span>' + tala + '</span></div>';
                htmlContent += '</div>';

                htmlContent += '<p class="artifact-story">' + item.story1 + '</p>';
                
                htmlContent += '<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">';
                htmlContent += '<button onclick="playAudio(\'' + (item.audio || '') + '\')" class="btn-pakinggan">Pakinggan</button>';
                htmlContent += '</div>';
                
                htmlContent += '</div>';
            }

            container.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
