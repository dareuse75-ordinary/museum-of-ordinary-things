<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifacts Archives - Museum of Ordinary Things</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #f4f1ea;
            color: #2c2c2c;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            letter-spacing: 1px;
        }
        nav a:hover {
            color: #000;
        }
        h1.title {
            text-align: center;
            font-size: 32px;
            margin-top: 30px;
            letter-spacing: 2px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .artifact-card {
            background: #ffffff;
            border: 1px solid #e0dbce;
            margin-bottom: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .image-container {
            width: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .artifact-card img {
            width: 100%;
            height: auto;
            max-height: 600px;
            object-fit: contain; /* Buong naipapakita ang imahe nang walang pinuputol */
            display: block;
        }
        .artifact-content {
            padding: 30px;
        }
        .artifact-meta {
            text-align: center;
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .artifact-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1a1a1a;
        }
        .artifact-description {
            font-size: 15px;
            line-height: 1.8;
            color: #444;
            font-style: italic;
            margin-bottom: 25px;
        }
        .artifact-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-size: 13px;
            color: #666;
            flex-wrap: wrap;
            gap: 10px;
        }
        .share-btn {
            background: none;
            border: 1px solid #ccc;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Times New Roman', serif;
            font-size: 12px;
            color: #444;
        }
        .share-btn:hover {
            background: #2c2c2c;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 15px; letter-spacing: 2px;">MUSEUM OF ORDINARY THINGS</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="artifacts.html">ARTIFACTS ARCHIVES</a>
            <a href="exhibition.html">EXHIBITION</a>
            <a href="donate.html">DONATE</a>
            <a href="admin.html">ADMIN</a>
        </nav>
    </header>

    <h1 class="title">Artifacts Archives</h1>

    <div class="container" id="archives-container">
        <!-- Dito kusang papasok ang mga approved artifacts mula sa database -->
    </div>

    <script src="db.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById("archives-container");
            const artifacts = getArtifacts();
            
            const approvedArtifacts = artifacts.filter(item => item.status === "Approved" || !item.status);

            if (approvedArtifacts.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #777;">Wala pang naka-archive na artifact sa ngayon.</p>`;
                return;
            }

            container.innerHTML = approvedArtifacts.map(item => `
                <div class="artifact-card">
                    <div class="image-container">
                        <img src="${item.imageUrl}" alt="${item.title}">
                    </div>
                    <div class="artifact-content">
                        <div class="artifact-meta">${item.imageName} | ${item.descriptionName}</div>
                        <div class="artifact-title">${item.title}</div>
                        <div class="artifact-description">${item.description}</div>
                        <div class="artifact-footer">
                            <span>👁️ ${item.views || 0} Views</span>
                            <span>❤️ ${item.likes || 0} Likes</span>
                            <span>🎧 ${item.audioName}</span>
                            <button class="share-btn" onclick="shareArtifact('${item.title}')">Ibahagi (Share)</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });

        function shareArtifact(title) {
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `Tingnan ang kwento ng "${title}" sa Museum of Ordinary Things!`,
                    url: window.location.href,
                }).catch((error) => console.log('Error sharing:', error));
            } else {
                alert("Hindi suportado ng browser mo ang direktang share. Kopyahin na lamang ang link.");
            }
        }
    </script>
</body>
</html>
