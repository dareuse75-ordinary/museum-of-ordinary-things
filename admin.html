<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control - Museum of Ordinary Things</title>
    <style>
        body {
            background-color: #f4f0ea;
            font-family: serif;
            color: #2c221e;
            padding: 20px;
            margin: 0;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .admin-card {
            background: #fff;
            border: 1px solid #d3c5b4;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .meta-info {
            font-size: 0.85rem;
            color: #6c584c;
            margin-bottom: 10px;
            display: block;
        }
        h3 {
            margin-top: 0;
            font-size: 1.3rem;
        }
        p {
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .audio-info {
            font-size: 0.85rem;
            font-style: italic;
            margin: 15px 0;
            color: #555;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: #e6dfd5;
            color: #443322;
        }
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-family: serif;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .btn-approve {
            background-color: #4a6b5d;
            color: white;
        }
        .btn-edit {
            background-color: #2c221e;
            color: white;
        }
        .btn-delete {
            background-color: transparent;
            border: 1px solid #8b0000;
            color: #8b0000;
        }
    </style>
</head>
<body>

    <h1>Admin Control - Museum of Ordinary Things</h1>
    
    <div id="admin-container">
        <!-- Dito papasok ang mga artifact mula sa database -->
    </div>

    <script src="db.js"></script>
    <script>
        function renderAdminList() {
            const container = document.getElementById('admin-container');
            const artifacts = getArtifacts();
            
            if (artifacts.length === 0) {
                container.innerHTML = `<p style="text-align: center;">Walang nakabinbing artifact sa ngayon.</p>`;
                return;
            }

            container.innerHTML = '';
            
            artifacts.forEach(item => {
                let isApproved = item.status === "Approved";
                let statusClass = isApproved ? "status-badge status-approved" : "status-badge";
                let statusText = isApproved ? "Naka-apruba na (Published)" : "Nakabinbin (Pending)";

                let card = document.createElement('div');
                card.className = 'admin-card';
                card.innerHTML = `
                    <span class="${statusClass}">${statusText}</span>
                    <span class="meta-info">${item.imageName} | ${item.descriptionName} | ${item.audioName}</span>
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <div class="audio-info">Audio Link: ${item.audioUrl}</div>
                    
                    <div class="btn-group">
                        ${!isApproved ? `<button class="btn-approve" onclick="approveItem(${item.id})">I-apruba / I-publish</button>` : ''}
                        <button class="btn-edit" onclick="alert('I-edit ang item na ito')">I-edit / Audio</button>
                        <button class="btn-delete" onclick="removeItem(${item.id})">Tanggalin</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function approveItem(id) {
            if(updateArtifactStatus(id, "Approved")) {
                alert("Matagumpay na na-apruba ang artifact!");
                renderAdminList();
            }
        }

        function removeItem(id) {
            if(confirm("Sigurado ka bang gusto mong tanggalin ito?")) {
                deleteArtifact(id);
                renderAdminList();
            }
        }

        // I-load ang listahan pagbukas ng pahina
        window.onload = renderAdminList;
    </script>
</body>
</html>
